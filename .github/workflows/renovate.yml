name: Renovate

# Self-hosted Renovate. Needs a RENOVATE_TOKEN repository secret: a token (not
# the default GITHUB_TOKEN, whose PRs would not trigger CI) that can write
# contents, pull requests, issues and workflows on this repository.

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: renovatebot/github-action@v46.3.13
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          LOG_LEVEL: info
